<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta name="theme-color" content="#1783C1">

    <title>Artos - Offline</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 360px;
        }

        h1 {
            margin: 0 0 12px;
            color: #1783C1;
            font-size: 42px;
        }

        p {
            margin: 0;
            color: #333333;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Artos</h1>
        <p>
            You are currently offline.
            Please check your internet connection and try again.
        </p>
    </main>

</html>
